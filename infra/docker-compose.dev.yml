name: arrancar-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: arrancar
      POSTGRES_USER: arrancar
      POSTGRES_PASSWORD: arrancar
      ARRANCAR_APP_PASSWORD: arrancar_app
      CREAR_BD_PRUEBAS: "si"
    ports:
      - "5433:5432"
    volumes:
      - datos-postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  datos-postgres:
