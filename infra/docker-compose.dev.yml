name: arrancar-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: arrancar
      POSTGRES_USER: arrancar
      POSTGRES_PASSWORD: arrancar
      ARRANCAR_APP_PASSWORD: arrancar_app
      CREAR_BD_PRUEBAS: 'si'
    ports:
      - '5433:5432'
    volumes:
      - datos-postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  # Servidor de correo de mentira para desarrollo: recibe todo y no manda nada afuera.
  # SMTP en el 1025 (sin cifrado) y bandeja en http://localhost:8025, solo para este equipo (la bandeja
  # no tiene contraseña). Versión sin avisos de seguridad conocidos: no bajar de la 1.28.2.
  mailpit:
    image: axllent/mailpit:v1.34.0
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

volumes:
  datos-postgres:

# Subred fija: en WSL un puente viejo de Docker puede reaparecer al reiniciar con la subred que se asignaría sola
# (172.19.0.0/16) y quedarse con el tráfico, y entonces nada se conecta al 5433.
networks:
  default:
    ipam:
      config:
        - subnet: 172.31.250.0/24
